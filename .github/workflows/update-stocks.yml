name: Update LibertyVIP Stocks Watchlist

on:
  workflow_dispatch:
  schedule:
    # GitHub cron is UTC and top-of-hour schedules can be delayed/dropped.
    # Running at :17 avoids the busy minute. Two UTC slots cover both
    # daylight and standard time; if GitHub starts late, the job still runs.
    - cron: "17 14,15 * * 1"

concurrency:
  group: liberty-stocks-watchlist
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-stocks:
    runs-on: ubuntu-latest
    steps:
      - name: Log Toronto time
        run: |
          echo "Running stock update at $(TZ=America/Toronto date '+%Y-%m-%d %H:%M:%S %Z')"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh Finviz watchlist
        run: python scripts/update_finviz_watchlist.py

      - name: Commit and push update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stocks/index.html stocks/latest.json
          if git diff --cached --quiet; then
            echo "No changes to publish."
          else
            git commit -m "Update LibertyVIP Finviz watchlist"
            git push
          fi
